<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국민건강영양조사</title>
    <!-- Include main styles but be careful with global overrides -->
    <link rel="stylesheet" href="/static/style.css?v=27">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: top center;
            display: block;
        }

        .chat-btn-container {
            position: absolute;
            bottom: 15px;
            right: 78px;
            z-index: 1010;
            /* Higher than modal */
        }

        .chat-btn {
            width: 90px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.3));
        }

        .chat-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="bg-container">
        <img src="/static/resources/landing_bg.png" alt="질병관리청 배경" class="bg-image">
    </div>

    <!-- Chatbot Toggle Button -->
    <div class="chat-btn-container" onclick="toggleChat()">
        <img src="/static/resources/chat_icon.png" alt="챗봇 시작하기" class="chat-btn">
    </div>

    <!-- Modal Container -->
    <div id="chat-modal">
        <div class="container">
            <header>
                <span class="close-btn" onclick="toggleChat()">&times;</span>
                <h1>국민건강영양조사 RAG 챗봇</h1>
                <div class="source-selector">
                    <div class="dropdown">
                        <button id="dropdown-btn" class="dropdown-btn">검색 대상 기수 선택 (전체)</button>
                        <div id="filter-container" class="dropdown-content">
                            <!-- 체크박스가 자바스크립트로 동적 생성됩니다 -->
                        </div>
                    </div>
                </div>
            </header>
            <main id="chat-window" class="chat-window">
                <!-- 채팅 메시지가 여기에 추가됩니다. -->
            </main>
            <footer>
                <div class="input-container">
                    <input type="text" id="message-input" placeholder="질문을 입력하세요..." autocomplete="off">
                    <button id="send-button">전송</button>
                </div>
            </footer>
        </div>
    </div>

    <!-- Toggle Script -->
    <script>
        function toggleChat() {
            const modal = document.getElementById('chat-modal');
            modal.classList.toggle('open');
            // If main.js hasn't connected or needs focus, we could do it here
            // But main.js runs on load, so it should be ready.
        }
    </script>

    <!-- Chat Logic -->
    <script src="/static/main.js?v=7"></script>
</body>

</html>
